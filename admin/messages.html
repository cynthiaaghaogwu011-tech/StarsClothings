<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>starsClothing | Inquiry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 950: '#020617', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#09090b] text-zinc-400 font-sans antialiased flex min-h-screen">
    <!-- 1. Left Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-brand-950 border-r border-zinc flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 ease-in-out">
        <div class="flex flex-col">
            <!-- Brand Area -->
            <div class="h-16 px-6 border-b border-brand-border flex items-center justify-between">
                <span class="font-mono text-sm font-bold tracking-wider uppercase text-white">STARSCLOTHING ADMIN</span>
                <button onclick="toggleSidebar()" class="lg:hidden text-brand-textMuted hover:text-white">
                    <!-- Icon: Close 'X' -->
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <nav class="p-4 space-y-1 mt-4">
                <a href="admin-dashboard.html" class="flex items-center space-x-3 text-zinc-500 hover:text-white px-4 py-3 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="admin-products.html" class="flex items-center space-x-3 text-zinc-500 hover:text-white px-4 py-3 transition-all text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    <span>Products</span>
                </a>
                <a href="admin-orders.html" class="flex items-center space-x-3 text-zinc-500 hover:text-white px-4 py-3 transition-all text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    <span>Orders</span>
                </a>
                <a href="admin-customers.html" class="flex items-center space-x-3 text-zinc-500 hover:text-white px-4 py-3 transition-all text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span>Customers</span>
                </a>
                <a href="messages.html" class="flex items-center space-x-3 text-white bg-zinc-900 rounded-lg px-4 py-3 transition-all text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span>Messages</span>
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-zinc-800">
            <a href="#" class="flex items-center space-x-3 text-zinc-500 hover:text-red-400 px-4 py-3 transition-all text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Core Split Screen View Container -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- TOP BAR -->
            <!-- 2. Middle Panel: Inbox List Stream -->
            <section id="inbox-list" class="w-full md:w-[350px] lg:w-[380px] border-r border-brand-border flex flex-col shrink-0 h-full ">
                <!-- Panel Header Information -->
                <div class="p-6 border-b border-brand-border space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-bold tracking-tight text-white">Inbox</h2>
                        <span id="contact-count" class="px-2 py-0.5 bg-[#151F32] text-[9px] font-mono tracking-wider text-brand-textMuted uppercase rounded-none">  0 contacts</span>
                    </div>

                    <!-- Search Box -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center">
                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.637 10.637z" />
                            </svg>
                        </span>
                        <input type="text" placeholder="Search inquiries..." class="w-full pl-9 pr-3 py-2 bg-brand-bg border border-brand-border text-xs text-white placeholder-slate-600 focus:outline-none focus:border-slate-500 rounded-none transition-colors">
                    </div>
                    <!-- Filters System -->
                    <div class="flex items-center space-x-2 text-[10px] font-mono uppercase tracking-wider">
                        <button id="all-filter" class="px-3 py-1 bg-white text-[#080C14] font-bold">ALL</button>
                        <button id="unread-filter" class="px-3 py-1 border border-brand-border text-brand-textMuted hover:text-white hover:bg-white/5">Unread</button>
                        <button class="px-3 py-1 border border-brand-border text-brand-textMuted hover:text-white hover:bg-white/5">Flagged</button>
                    </div>
                </div>
                <div id="contact-list" class="flex-grow overflow-y-auto divide-y divide-brand-border/40"></div>                
            </section>
            <!-- 3. Right Panel: Selected Message Reader (Hidden on mobile unless selected) -->
            <section id="message-view" class="hidden md:flex flex-1 flex-col h-full bg-[#080C14] overflow-hidden absolute md:static inset-0 z-30 bg-[#09090b]">               
                <!-- Message Header / Control Toolbar Row -->
                <div class="p-6 border-b border-brand-border flex items-center justify-between shrink-0">
                    <div class="flex items-center space-x-3">
                        <!-- Mobile Back button (Shows only on mobile viewports) -->
                        <button onclick="backToList()" class="md:hidden text-brand-textMuted hover:text-white mr-1">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                            </svg>
                        </button>
                        <h2 id="view-subject" class="text-lg sm:text-xl font-bold tracking-tight text-white leading-tight">
                            Inquiry History
                        </h2>
                    </div>
                    <!-- Quick Icon Action Buttons -->
                    <div class="flex items-center space-x-1.5">
                        <!-- Flag -->
                        <button class="p-2 border border-brand-border bg-brand-card hover:bg-[#151F32]/40 text-brand-textMuted hover:text-white transition-all rounded-none">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v1.5M3 21v-6m0 0l2.77-.693a9 9 0 016.208.682l.108.054a9 9 0 006.086.71l3.114-.732a48.524 48.524 0 01-.005-10.499l-3.11.732a9 9 0 01-6.085-.711l-.108-.054a9 9 0 00-6.208-.682L3 4.5M3 15V4.5" />
                            </svg>
                        </button>
                        <!-- Envelope -->
                        <button class="p-2 border border-brand-border bg-brand-card hover:bg-[#151F32]/40 text-brand-textMuted hover:text-white transition-all rounded-none">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25" />
                            </svg>
                        </button>
                        <!-- Archive -->
                        <button class="p-2 border border-brand-border bg-brand-card hover:bg-[#151F32]/40 text-brand-textMuted hover:text-white transition-all rounded-none">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
                            </svg>
                        </button>
                        <!-- Trash -->
                        <button id="delete-contact-button" class="p-2 border border-brand-border bg-brand-card hover:bg-[#151F32]/40 text-brand-textMuted hover:text-red-500 transition-all rounded-none">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-1.816A2.25 2.25 0 0122.16 5.79H2.25a2.25 2.25 0 011.07-1.916V5.79M16.5 13.5v-2.25a2.25 2.25 0 00-2.25-2.25h-4.5a2.25 2.25 0 00-2.25 2.25v2.25" />
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Message Body scroll wrapper -->
                <div class="flex-grow overflow-y-auto p-6 space-y-6">                   
                    <!-- Sender metadata details row -->
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-brand-border pb-6">
                        <div class="flex items-center space-x-3">
                            <div id="view-avatar" class="w-10 h-10 bg-brand-border flex items-center justify-center font-mono font-bold text-sm"></div>
                            <div>
                                <h3 id="view-sender-name" class="text-sm font-bold text-white"></h3>
                                <span id="view-sender-meta" class="block font-mono text-[10px] text-brand-textMuted leading-relaxed"></span>
                            </div>
                        </div>
                        <div class="text-left sm:text-right font-mono text-[10px] text-brand-textMuted space-y-0.5">
                            <span class="block">Oct 14, 2023, 10:42 AM</span>
                            <span class="block text-brand-textMuted/70">(2 hours ago)</span>
                        </div>
                    </div>
                    <!-- Main Text content container -->
                    <div id="view-body" class="text-xs sm:text-sm text-[#D1D5DB] leading-relaxed space-y-4">
                        <p></p>             
                    </div>
                </div>

                <!-- Footer Text Reply input field box -->
                <div class="p-6 border-t border-brand-border bg-[#0A0E17]/60 shrink-0">
                    <form onsubmit="handleSendReply(event)" class="border border-brand-border bg-brand-bg rounded-none">
                        <textarea id="reply-input" rows="4" placeholder="Type your reply to Sarah Jenkins..." required class="w-full p-4 bg-transparent text-xs sm:text-sm text-white placeholder-slate-600 focus:outline-none resize-none"></textarea>                        
                        <!-- Mini toolbar panel -->
                        <div class="px-4 py-3 border-t border-brand-border/60 flex items-center justify-between">
                            <div class="flex items-center space-x-3 text-slate-500">
                                <button type="button" class="hover:text-white transition-colors">
                                        <!-- Attachment Paperclip -->
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L10.5 11.25" />
                                        </svg>
                                    </button>
                                    <button type="button" class="hover:text-white transition-colors">
                                        <!-- Document template list -->
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                                        </svg>
                                    </button>
                                </div>
                                <button type="submit" class="px-5 py-2.5 bg-white text-[#080C14] font-mono text-xs tracking-wider uppercase font-bold hover:bg-neutral-200 transition-colors rounded-none flex items-center space-x-2">
                                    <span>Send Reply</span>
                                    <span class="text-[10px]">➔</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>

    

    <script>
        const API_BASE = 'https://starsclothings.onrender.com';

        let selectedContactId = null;
        let selectedContactRow = null;
        let selectedContactEmail = null;
        let currentFilter = "all";
        
        // Returning to inbox view on mobile
        function backToList() {
            const viewPanel = document.getElementById('message-view');
            viewPanel.classList.add('hidden');
            viewPanel.classList.remove('flex');
        }

        // Toggle left sidebar drawer
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }

        // reply message submission
        async function handleSendReply(event) {
            event.preventDefault();
            const textarea = document.getElementById('reply-input');
            const replyMessage = textarea.value;
            const submitBtn = event.target.querySelector('button[type="submit"]');               
                if (!selectedContactId) {
                    alert("Please select a contact first.");
                    return;
                }
                if (!replyMessage.trim()) {
                alert("Please enter a reply.");
                    return;
                }
            submitBtn.innerHTML = `<span>SENDING...</span>`;
            submitBtn.disabled = true;
            try {
                const response = await fetch(`${API_BASE}/contact/reply`, 
                {
                    credentials: "include",
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        contactId: selectedContactId,
                        email: selectedContactEmail,
                        message: replyMessage
                    })
                }
            );
                const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.message || "Failed to send reply.");
                    }
                const updateResponse = await fetch( `${API_BASE}/contact/${selectedContactId}`,
                    {
                        credentials: "include",
                        method: "PUT",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({
                            status: "replied"
                        })
                    }
                );
                if (!updateResponse.ok) {
                    throw new Error("Reply was sent, but the inquiry status could not be updated.");
                }
                    alert("Reply sent successfully!");
                        textarea.value = "";
                        submitBtn.innerHTML = `<span>SEND REPLY</span>`;
                        submitBtn.disabled = false;
            } catch (error) {
                console.error("Reply error:", error);
                alert("Failed to send reply: " + error.message);
                submitBtn.innerHTML = `<span>SEND REPLY</span>`;
                submitBtn.disabled = false;
            }
        }

        async function selectContact(contact, contactRow) {
            selectedContactId = contact._id;
                const response = await fetch(`${API_BASE}/contact/${selectedContactId}`, {
                    credentials: "include",
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                    status: "read"
                })
            });
            selectedContactEmail = contact.email;

            document.getElementById("view-subject").innerText = "contact Inquiry";
            document.getElementById("view-sender-name").innerText = contact.name;
            document.getElementById("view-sender-meta").innerText = contact.email;
            document.getElementById("view-body").innerText = contact.message;
            document.getElementById("view-avatar").innerText = contact.name.charAt(0).toUpperCase();
            document.getElementById("reply-input").placeholder = `Type your reply to ${contact.name}...`;
            const viewPanel = document.getElementById("message-view");
            viewPanel.classList.remove("hidden");
            viewPanel.classList.add("flex");
        }

        document.getElementById("delete-contact-button").addEventListener("click", async() => {
            if (!selectedContactId) {
                alert("Please select a contact first.");
                return;
            }
            const confirmed = confirm("Are you sure you want to delete this contact?");
            if(!confirmed) {
                return;
            }
            const response = await fetch(`${API_BASE}/contact/${selectedContactId}`,
                {method: "DELETE", credentials: "include"}
            );
            const result = await response.json();
            console.log(result);
            if (response.ok) {
                selectedContactRow.remove();
                const contactCount = document.getElementById("contact-count");
                contactCount.innerText = `${document.querySelectorAll("#contact-list > div").length} Contacts`
                selectedContactId = null;
                selectedContactRow = null;
            }
        });
        async function getContacts() {
            const response = await fetch(`${API_BASE}/contact`, { credentials: "include" });
            const result = await response.json();
            const contactList = document.getElementById("contact-list");
            contactList.innerHTML = "";
            const contactCount = document.getElementById("contact-count");
            const unreadContacts = result.data.filter(contact => contact.status === "new");
            let contactsToDisplay = result.data;
            if (currentFilter === "unread") {
                contactsToDisplay = unreadContacts;
            }
            contactCount.innerText = `${result.data.length} Contacts · ${unreadContacts.length} Unread`;
            contactsToDisplay.forEach(contact => {
                const contactRow = document.createElement("div");
                contactRow.className = "p-5 cursor-pointer hover:bg-[#151F32]/20 transition-colors space-y-2";
                contactRow.addEventListener("click", () => {
                    selectContact(contact, contactRow);
                });
                contactRow.innerHTML = ` 
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-white"> ${contact.name}</span>
                        <span class="font-mono text-[9px] text-brand-textMuted"> ${(contact.status || "new").toUpperCase()} </span> 
                    </div> 
                    <h4 class="text-xs font-bold text-white tracking-tight"> Contact Inquiry </h4>
                    <p class="text-[11px] text-brand-textMuted leading-normal line-clamp-2"> ${contact.message} </p>
                    <div class="pt-1">
                        <span class="px-2 py-0.5 bg-brand-bg border border-brand-border text-[9px] font-mono text-brand-textMuted uppercase rounded-none"> 
                            ${contact.email}
                        </span>
                    </div>
                `;
                contactList.appendChild(contactRow);
            });

            console.log(result);
        }

        (async () => {  //IIFE to check authentication on page load.
            await checkAuthentication();
            getContacts();
        })();

        document.getElementById("unread-filter").addEventListener("click", () => {
            currentFilter = "unread";
            updateFilterButtons();
            getContacts();
        });
        document.getElementById("all-filter").addEventListener("click", () => {
            currentFilter = "all";
            updateFilterButtons();
            getContacts();
        });

        function updateFilterButtons() {
            const allButton = document.getElementById("all-filter");
            const unreadButton = document.getElementById("unread-filter");
            if (currentFilter === "all") {
                allButton.className = "px-3 py-1 bg-white text-[#080C14] font-bold";
                unreadButton.className = "px-3 py-1 border border-brand-border text-brand-textMuted hover:text-white hover:bg-white/5";
            } else {
                allButton.className = "px-3 py-1 border border-brand-border text-brand-textMuted hover:text-white hover:bg-white/5";
                unreadButton.className = "px-3 py-1 bg-white text-[#080C14] font-bold";
            }
        }
        async function checkAuthentication() {
            const response = await fetch(`${API_BASE}/auth/check`, {
                method: "GET",
                credentials: "include",
                cache: "no-store"
            });
            if (!response.ok) {
                window.location.href = "adminlogin.html";
                return;
            }
            console.log("Admin is authenticated.");
        }

    </script>
</body>
</html>
